<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jurusan SMK: TKJ, TAV, AKL, TSM, TKR</title>
<style>
    :root{
        --bg:#0b1220;
        --card:#151d30;
        --border:#253148;
        --text:#e8eef7;
        --muted:#9aa7bd;
        --accent:#60a5fa;
        --accent2:#34d399;
        --yellow:#fbbf24;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        font-family:'Segoe UI',system-ui,Arial,sans-serif;
        background:var(--bg);
        color:var(--text);
        line-height:1.6;
        padding:20px;
    }
   .container{max-width:1100px;margin:auto}

    header{text-align:center;margin-bottom:30px}
    h1{color:var(--accent);font-size:2.2rem;margin-bottom:8px}
   .subtitle{color:var(--muted);font-size:1rem}

   .tabs{
        display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
        margin-bottom:25px
    }
   .tab{
        padding:12px 20px;
        background:var(--card);
        border:1px solid var(--border);
        border-radius:10px;
        cursor:pointer;
        font-weight:600;
        transition:all 0.2s;
    }
   .tab:hover{border-color:var(--accent);transform:translateY(-2px)}
   .tab.active{background:var(--accent);color:#0b1220;border-color:var(--accent)}

   .content{
        background:var(--card);
        border:1px solid var(--border);
        border-radius:14px;
        padding:30px;
        animation:fade 0.3s ease
    }
    @keyframes fade{
        from{opacity:0;transform:translateY(8px)}
        to{opacity:1;transform:translateY(0)}
    }

    h2{color:var(--yellow);margin-bottom:15px;font-size:1.6rem}
    h3{color:var(--accent);margin:20px 0 10px;font-size:1.2rem}

   .tags{margin-bottom:15px}
   .tag{
        display:inline-block;
        background:var(--border);
        padding:6px 12px;
        border-radius:20px;
        font-size:12px;
        margin:4px 6px 4px 0;
        color:var(--muted)
    }

   .grid{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
        gap:15px;
        margin-top:10px
    }
   .card{
        background:#0b1220;
        border:1px solid var(--border);
        border-radius:10px;
        padding:15px;
    }
   .card strong{color:var(--accent2)}
    ul{padding-left:20px}
    li{margin-bottom:8px}

   .career{
        background:linear-gradient(90deg,rgba(52,211,153,0.15),transparent);
        border-left:3px solid var(--accent2);
        padding:12px 15px;
        border-radius:6px;
        margin-top:15px
    }

    footer{
        text-align:center;
        margin-top:30px;
        color:var(--muted);
        font-size:14px
    }

    @media(max-width:600px){
        h1{font-size:1.6rem}
       .content{padding:20px}
    }
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>📚 Panduan Jurusan SMK</h1>
        <p class="subtitle">Materi, Skill & Peluang Kerja TKJ, TAV, AKL, TSM, TKR</p>
    </header>

    <div class="tabs" id="tabs"></div>
    <div class="content" id="content"></div>

    <footer>
        <p>Pilih jurusan sesuai minat. SMK = 70% praktik, 30% teori</p>
    </footer>
</div>

<script>

    kerja:[

        "Crew Broadcasting TV/YouTube - 4-8 jt/bulan",
        "Sound Engineer Event",
        "Teknisi IoT & Smart Home"
    ]
},
{

    deskripsi:"Fokus ke pembukuan, perpajakan, dan penyusunan laporan keuangan perusahaan.",
    materi:[

    ],
    kerja:[

    ]

{

    id:"tkr",

    tags:["Otomotif","Mobil","Mesin","Kelistrikan"],
    deskripsi:"Fokus ke perawatan, perbaikan, dan diagnosa mobil bensin & diesel.",
    materi:[
        "Sistem Mesin: overhoul, tune up, kalibrasi injeksi",

    ],
    kerja:[
        "Mekanik Bengkel Resmi - 3.5-6 jt/bulan",
        "Service Advisor - 4-7 jt/bulan",

        "Wirausaha Bengkel Mobil",
        "Quality Control Otomotif"
    ]
}
];

const tabsEl = document.getElementById("tabs");
const contentEl = document.getElementById("content");

function renderTabs(){
    data.forEach((j,index)=>{
        const btn = document.createElement("div");
        btn.className = "tab" + (index===0? " active" : "");
        btn.textContent = j.id.toUpperCase();
        btn.onclick = ()=>showJurusan(index);
        tabsEl.appendChild(btn);
    });
}

function showJurusan(index){
    document.querySelectorAll(".tab").forEach((t,i)=>{
        t.classList.toggle("active", i===index);
    });

    const j = data[index];
    contentEl.innerHTML = `
        <h2>${j.nama}</h2>
        <div class="tags">${j.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
        <p><strong>Deskripsi:</strong> ${j.deskripsi}</p>

        <h3>📖 Materi yang Dipelajari</h3>
        <div class="grid">
            ${j.materi.map(m=>`<div class="card">• ${m}</div>`).join("")}
        </div>

        <h3>🛠️ Skill yang Didapat</h3>
        <div class="grid">
            ${j.skill.map(s=>`<div class="card"><strong>•</strong> ${s}</div>`).join("")}
        </div>

        <div class="career">
            <h3>💼 Peluang Kerja & Estimasi Gaji</h3>
            <ul>
                ${j.kerja.map(k=>`<li>${k}</li>`).join("")}
            </ul>
        </div>
    `;
}

renderTabs();
showJurusan(0);
</script>
</body>
</html>
